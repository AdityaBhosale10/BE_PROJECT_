services:
  productgpt-backend:
    build:
      context: ./chatbot-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - chatbot-server/.env
    networks:
      - chatbot-network

  productgpt-app:
    build:
      context: ./chatbot-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    networks:
      - chatbot-network

  productgpt-redis:
    image: redis:7-alpine
    container_name: productgpt-redis
    ports:
      - "6379:6379"
    networks:
      - chatbot-network

networks:
  chatbot-network: {}